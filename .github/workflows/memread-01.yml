name: MEMREAD-01 implementation

on:
  push:
    branches:
      - memread-01-implementation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memread-01-implementation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify implementation baseline
        run: |
          test "$(git merge-base HEAD origin/main)" = "c1af123cf7146b590845a2564e7542398d2ad410"
      - name: Apply scoped implementation
        run: |
          set +e
          python tools/memread01_patch.py > memread01-patch.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -q 'legacy read target remains in tests/unit/test_simulator_workflow.py' memread01-patch.log; then
              sed -i '/^[[:space:]]*ReadTarget,$/d' tests/unit/test_simulator_workflow.py
            else
              cat memread01-patch.log
              exit "$rc"
            fi
          fi
          cat memread01-patch.log
      - name: Remove temporary automation files
        run: git rm -f tools/memread01_patch.py .github/workflows/memread-01.yml
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Python syntax checks
        run: |
          python -m py_compile \
            pc/src/bootloader_upgrade_tool/protocol/constants.py \
            pc/src/bootloader_upgrade_tool/core/client.py \
            pc/src/bootloader_upgrade_tool/operations/memory_ops.py \
            pc/src/bootloader_upgrade_tool/simulator/core.py \
            pc/src/bootloader_upgrade_tool/tools/metadata_probe.py
      - name: Focused software tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/unit/test_memory_read_operation.py \
            tests/unit/test_simulator_workflow.py \
            tests/unit/test_metadata_probe.py \
            tests/unit/test_dsp_host.py \
            tests/unit/test_phase_10_8a_foundation.py \
            tests/unit/test_phase_10_8a_operations.py 2>&1 | tee memread01-tests.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memread01-test-log-${{ github.run_id }}
          path: memread01-tests.log
      - name: Stop after test failure
        if: ${{ steps.tests.outcome != 'success' }}
        run: exit 1
      - name: Compile-time cut evidence
        run: |
          grep -q '#define BOOT_ENABLE_MEMORY_READ 0U' dsp/bootloader_user/include/boot_user_feature_config.h
          ! grep -q 'BOOT_ENABLE_FLASH_READ' dsp/bootloader_user/include/boot_user_feature_config.h
          grep -q '#if BOOT_ENABLE_MEMORY_READ' dsp/bootloader_core/src/boot_algorithm.c
          grep -q 'case BOOT_CMD_MEMORY_READ' dsp/bootloader_core/src/boot_algorithm.c
          grep -q 'BOOT_FEATURE_MEMORY_READ' dsp/bootloader_common/include/boot_device_info.h
      - name: Diff validation
        run: |
          git diff --check
          git status --short
      - name: Commit implementation
        if: github.event_name == 'push'
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add -A
          git commit -m 'feat(debug): add optional generic MEMORY_READ'
          git push origin HEAD:memread-01-implementation
